# dex-grid 配置示例
#
# 这里只放【密钥与运维参数】。网格参数优先走 Web 控制台 / REST。
# strategy_file 仅在 SQLite 还没有该交易所策略时作为初始模板；autostart 默认关闭。
#
# 复制为 config.yaml 后修改。字段说明见 docs/GRID_CONFIG.md，部署见 docs/DEPLOYMENT.md
#
# 约定：
#   - 价格/数量/金额一律用字符串书写，避免 YAML 解析成 float 丢精度
#   - ${VAR} 会做环境变量展开；密钥必须走环境变量或同目录 .env 文件
#   - 相对路径基于「可执行文件所在目录」，不是当前工作目录

app:
  log_level: info            # debug | info | warn | error
  log_format: json           # json | text（本地调试用 text 更易读）
  log_file: ./logs/gridbot.log
  log_buffer_size: 2000      # 页面日志面板的内存环形缓冲条数
  data_dir: ./data
  tick_interval: 1s          # 定时事件间隔，驱动跟价/超时/止盈止损检查
  reconcile_interval: 15s    # 运行中挂单看门狗：缺补、多撤。0 则用 15s
  shutdown_timeout: 30s
  http_timeout: 15s          # 交易所 REST 客户端超时，与进程退出等待无关

server:
  addr: "127.0.0.1:8080"     # 默认只本机。公网监听 0.0.0.0:8080 时必须开 auth 或 ip_whitelist
  auth:
    # 默认关闭。公网监听时必须开启 Bearer Token，所有 /api/* 校验 Authorization 头
    enabled: false
    token: ${GRIDBOT_TOKEN}
  metrics_enabled: true      # 字段保留；当前没有 /metrics 端点
  cors_origins: ["*"]        # 允许任意来源调用 API；收紧时可改成具体 Origin
  trusted_proxies: []        # 可信反代 IP/CIDR；非空时才采信 X-Forwarded-For
  ip_whitelist:
    enabled: false           # true 后只允许 allow 列表里的 IP（未配 trusted_proxies 时本机始终放行）
    allow:
      - 127.0.0.1
      # - 1.2.3.4
      # - 10.0.0.0/8

proxy:
  # 国内网络访问部分 DEX 需要代理。对 REST 与 WebSocket 同时生效。
  enabled: false
  url: "http://127.0.0.1:7890"   # 或 socks5://127.0.0.1:1080
  username: ""
  password: ""
  no_proxy: ["localhost", "127.0.0.1"]
  health_interval: 60s           # 连通性探测间隔，结果驱动页面代理状态灯

exchanges:
  # 每个交易所只能出现一次 —— 一个 DEX 只运行一个网格实例。
  - name: lighter
    enabled: true
    network: mainnet             # mainnet | testnet（先在 testnet 跑通再上主网）

    credentials:
      account_index: ${LIGHTER_ACCOUNT_INDEX}
      # 不要复用 Lighter 官方前端正在使用的 api_key_index，否则 nonce 会冲突
      api_key_index: ${LIGHTER_API_KEY_INDEX}
      api_key_private_key: ${LIGHTER_API_KEY_PRIVATE_KEY}

    options:
      tx_send_channel: ws        # ws（低延迟，推荐）| rest
      batch_enabled: true        # 使用 sendTxBatch，铺满网格的关键
      batch_size: 20
      order_expiry: 28d          # GTT 有效期，Lighter 上限 30d
      price_protection: true     # 市价单滑点保护

    rate_limit:
      rps: 10
      burst: 20

    timeout: 10s
    max_retries: 3
    reconnect:
      initial: 1s
      max: 30s

    # 无页面启动时取消下面两行注释：首次启动写入 SQLite，autostart 再自动开网格。
    # 有 Web 控制台时请保持关闭。
    # strategy_file: config/lighter-sol.yaml
    autostart: false

  # RH Lighter：另一条链上的独立 DEX，与上面的 lighter 账户/nonce/挂单完全隔离。
  # 启用前填好 RH_LIGHTER_* 环境变量；api_key_index 建议 ≥ 2（0 和 1 留给官方前后端）。
  - name: rh_lighter
    enabled: false
    network: mainnet

    credentials:
      account_index: ${RH_LIGHTER_ACCOUNT_INDEX}
      api_key_index: ${RH_LIGHTER_API_KEY_INDEX}
      api_key_private_key: ${RH_LIGHTER_API_KEY_PRIVATE_KEY}

    options:
      tx_send_channel: ws
      batch_enabled: true
      batch_size: 20
      order_expiry: 28d
      price_protection: true

    rate_limit:
      rps: 10
      burst: 20

    autostart: false

  # SODEx 永续（Bolt）。必须追加在 lighter / rh_lighter 之后，ClientOrderID slot=2。
  # X-API-Key 是密钥的 name（如 api-key-01），不是私钥。user_address 是主钱包地址。
  - name: sodex
    enabled: false
    network: mainnet             # mainnet | testnet

    credentials:
      account_index: ${SODEX_ACCOUNT_ID}
      api_key_private_key: ${SODEX_PRIVATE_KEY}

    options:
      api_key_name: ${SODEX_API_KEY}
      user_address: ${SODEX_ADDRESS}

    rate_limit:
      rps: 10
      burst: 20

    autostart: false

  # 后续接入的交易所在这里追加一段，格式同上
  # - name: <exchange>
  #   enabled: false
